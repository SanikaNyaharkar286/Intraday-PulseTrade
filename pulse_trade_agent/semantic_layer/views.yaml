gold_views:

  ai_vw_current_intraday:

    purpose:
      - current stock price
      - latest intraday indicators
      - current market condition


  ai_vw_scanner:

    purpose:
      - stock screening
      - technical indicator filtering

    allowed_questions:

      - RSI below 30 stocks
      - MACD bullish stocks
      - stocks above VWAP


  ai_vw_market_overview:

    purpose:
      - market sentiment
      - overall market condition


  ai_vw_current_breakouts:

    purpose:
      - breakout signals


  ai_vw_top_gainers:

    purpose:
      - best performing stocks


  ai_vw_top_losers:

    purpose:
      - worst performing stocks


  ai_vw_stock_returns:

    purpose:
      - historical performance
      - long term returns
  ai_vw_stock_metrics:

    purpose:

      - stock analysis
      - individual stock details
      - technical indicators comparison

    allowed_questions:

      - Analyze HDFC
      - Show RELIANCE indicators
      - Compare current technical metrics
  ai_vw_latest_daily:

    purpose:
      - latest daily stock price
      - daily performance
      - daily market snapshot

    allowed_questions:
      - What is today's stock price?
      - Show latest daily data